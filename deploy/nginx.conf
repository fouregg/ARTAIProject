# Фронт перед приложением: TLS, редирект с http и проксирование, включая websocket.
# Лежит на сервере в /opt/artai/nginx.conf.

server {
    listen 80;
    server_name ai.tavrida.art;

    # Проверка Let's Encrypt при выпуске и продлении сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai.tavrida.art;

    ssl_certificate     /etc/letsencrypt/live/ai.tavrida.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.tavrida.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Картинки бывают по два мегабайта; запас на будущее.
    client_max_body_size 16m;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;

        # Апгрейд до websocket для экрана цифрового холста.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Генерация занимает до полутора минут, а сокет холста висит часами.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
